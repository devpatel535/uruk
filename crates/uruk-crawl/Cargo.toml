[package]
name = "uruk-crawl"
description = "Uruk's web crawler: fetches politely, extracts text and links, stores compressed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Every dependency here is load-bearing and justified:
#   tokio    - the crawler is almost entirely network wait; async is the whole point
#   reqwest  - HTTP with redirect, timeout and connection-pool handling we should
#              not reimplement. rustls rather than OpenSSL: no C toolchain.
#   url      - URL parsing and relative resolution per WHATWG. Normalisation on
#              top of it is ours, in url.rs, because the rules are policy.
#   scraper  - html5ever-backed DOM. Real-world HTML is too broken for regex.
#   zstd     - crawl store compression (RESEARCH.md section 7)
#   serde    - crawl record serialisation
#   thiserror- typed errors; a crawler needs to distinguish failure kinds to
#              decide between retry, backoff and give up
#
# robots.txt is deliberately NOT a dependency. Politeness is a core value of
# this project, the matching rules are subtle (longest-match wins, wildcards,
# $ anchors), and we want them under test. See robots.rs.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
url = "2"
scraper = "0.23"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
