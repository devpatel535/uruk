[package]
name = "uruk"
description = "A search engine that returns links, not answers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "uruk"
path = "src/main.rs"

# Justifications:
#   uruk-crawl - the crawler this binary drives
#   uruk-index - the indexer
#   uruk-link  - the link graph and host authority
#   uruk-query - the query engine
#   uruk-serve - the web front end
#   clap       - argument parsing. Hand-rolling it was the alternative; clap
#                earns its place because the CLI grows a subcommand per phase
#                and its generated --help is the operator's documentation.
#   tokio      - the crawler is async, so the binary owns the runtime
#   url        - seed parsing, so a bad seed is reported before the crawl starts
[dependencies]
uruk-crawl = { path = "../uruk-crawl" }
uruk-index = { path = "../uruk-index" }
uruk-link = { path = "../uruk-link" }
uruk-query = { path = "../uruk-query" }
uruk-serve = { path = "../uruk-serve" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[lints]
workspace = true
