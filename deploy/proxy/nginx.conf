# nginx in front of uruk-serve.
#
# Everything below the logging block is ordinary. The logging block is not,
# and it is the reason this file exists.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name search.example.org;

    ssl_certificate     /etc/letsencrypt/live/search.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.example.org/privkey.pem;

    # THE IMPORTANT LINES.
    #
    # nginx's default access log format writes $request, which for this server
    # is `GET /search?q=<what the person typed> HTTP/1.1`, alongside
    # $remote_addr. That is a log of everybody's searches with their IP next to
    # it, retained for as long as logrotate is configured to keep it.
    #
    # The /privacy page says a search is not stored against an IP address.
    # Leaving these at their defaults makes that untrue, in a file nobody looks
    # at, because of a default that is correct for almost every other site.
    #
    # Off is the honest setting. `error_log` stays on, because a 500 with no
    # record of it is its own problem -- but note that error_log can include a
    # request line too, so it is raised to `crit` rather than left at `error`.
    access_log off;
    error_log  /var/log/nginx/uruk-error.log crit;

    # If you genuinely need traffic volume, count requests without recording
    # them. This format has no URI, no query string and no client address:
    #
    #   log_format uruk_counts '$time_iso8601 $status $request_method $body_bytes_sent';
    #   access_log /var/log/nginx/uruk-counts.log uruk_counts;
    #
    # Even then: a timestamp plus a status is enough to correlate with
    # something else if somebody is determined. Volume metrics are a want, not
    # a need.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Deliberately NOT set:
        #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #   proxy_set_header X-Real-IP $remote_addr;
        # uruk-serve does not read them, and passing a client IP into an
        # application that promises not to keep one is how it ends up kept.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uruk-serve sets CSP, Referrer-Policy, X-Content-Type-Options and
    # Cache-Control itself. HSTS belongs here, where TLS actually terminates.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
}

server {
    listen 80;
    listen [::]:80;
    server_name search.example.org;
    access_log off;
    return 301 https://$host$request_uri;
}
